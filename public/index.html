<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta Verified · Xác minh tích xanh và bảo vệ tài khoản</title>
    
    <!-- Meta mô tả cơ bản -->
    <meta name="description" content="Trung tâm hỗ trợ xác minh danh tính, nâng cấp tích xanh chính chủ và bảo vệ tài khoản theo tiêu chuẩn Meta." />
    
    <!-- OpenGraph để Instagram & Facebook tự động vẽ Card Thumbnail to đẹp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Meta Verified · Xác minh tích xanh và bảo vệ tài khoản" />
    <meta property="og:description" content="Trung tâm hỗ trợ xác minh danh tính, nâng cấp tích xanh chính chủ và bảo vệ tài khoản theo tiêu chuẩn Meta." />
    <!-- Ảnh banner chuẩn 1280x720 lấy từ hero-image.jpg trong dự án -->
    <meta property="og:image" content="/hero-image.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Meta Verified" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Meta Verified · Xác minh tích xanh và bảo vệ tài khoản" />
    <meta name="twitter:description" content="Trung tâm hỗ trợ xác minh danh tính, nâng cấp tích xanh chính chủ và bảo vệ tài khoản theo tiêu chuẩn Meta." />
    <meta name="twitter:image" content="/hero-image.jpg" />
</head>
<body>
    <div id="root"></div>
</body>
</html>
